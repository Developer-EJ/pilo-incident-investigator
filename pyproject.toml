[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pilo-incident-investigator"
version = "0.1.0"
description = "Evidence-based initial incident investigation for PILO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "boto3-stubs[bedrock-runtime,cloudwatch,dynamodb,ecs,elbv2,logs,rds,s3,secretsmanager,sqs,ssm]>=1.35,<2",
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
